name: nested modules
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read

jobs:
  sdk-nested-modules:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: 1.24
    steps:
      - name: git clone
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: set up go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # Nested modules are released together with the sdk, so they must
      # require the sdk version in VERSION and be tagged by the release.
      - name: check nested modules
        run: ./.nextmv/check-nested-modules.sh
