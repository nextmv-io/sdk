name: release
run-name: Release by @${{ github.actor }} from ${{ github.ref_name }}

on: [push]

jobs:
  release:
    if: ${{ github.ref_type == 'branch' }}
    uses: nextmv-io/release/.github/workflows/release.yml@d45d5a3eb15690d9957a8695847e93fe3793e6db  # develop
    permissions:
      contents: write
    with:
      BRANCH: ${{ github.ref_name }}
      REPOSITORY: sdk
      LANGUAGE: go
      PACKAGE_NAME: sdk
      PACKAGE_LOCATION: ./
      VERSION_FILE: VERSION
      # Nested modules are tagged on the same commit (checked by
      # .nextmv/check-nested-modules.sh).
      EXTRA_TAG_PREFIXES: "measure/routingkit/ measure/osrm/ measure/google/ measure/here/"
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}

  notify:
    needs: [release]
    if: ${{ needs.release.outputs.RELEASE_NEEDED == 'true' && needs.release.outputs.SHOULD_NOTIFY_SLACK == 'true' }}
    uses: nextmv-io/release/.github/workflows/notify-slack.yml@d45d5a3eb15690d9957a8695847e93fe3793e6db  # develop
    permissions:
      contents: read
    with:
      PACKAGE_NAME: sdk
      VERSION: ${{ needs.release.outputs.VERSION }}
      REPOSITORY: sdk
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
